[project]
name = "freecad-mcp"
version = "0.1.19"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.12.2",
    "validators>=0.34.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"
youtube-downloader = "youtube_downloader.cli:main"

[tool.hatch.build.targets.sdist]
exclude = ["assets", "results"]

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_mcp", "src/youtube_downloader"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
